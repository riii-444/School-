<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOUR VOICE｜教員用管理画面</title>
<style>
body{margin:0;background:#f6f8fa;color:#263746;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;line-height:1.6}header,main{max-width:950px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;background:white;max-width:none;border-bottom:1px solid #dce5ea}.brand{font-weight:bold;letter-spacing:.1em;color:#20384f;font-size:21px}a{color:#477b98}.warning{background:#fff4dc;border:1px solid #e8d39c;padding:13px;border-radius:8px;font-size:13px;margin:15px 0}.hero{background:#20384f;color:white;padding:22px;border-radius:10px}.hero h1{margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat,.item{background:white;border:1px solid #dce5ea;border-radius:8px;padding:14px}.stat b{display:block;font-size:23px;color:#20384f}.stat span,.meta,.hint{font-size:12px;color:#687985}.item{margin:12px 0}.top{display:flex;justify-content:space-between;gap:10px}.item h3{margin:4px 0}.body{white-space:pre-wrap;background:#f5f7f8;padding:10px;border-radius:6px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:bold;margin:7px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd7de;border-radius:6px;font:inherit}textarea{min-height:70px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.btn{background:#477b98;color:white;border:0;padding:9px 14px;border-radius:6px;font-weight:bold;margin-top:12px}.empty{background:white;padding:24px;text-align:center;border:1px dashed #ccd8df;border-radius:8px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{display:block}}
</style></head><body><header><div class="brand">YOUR VOICE</div><a href="./">生徒用ページへ戻る</a></header><main>
<div class="warning"><b>試作画面・重要：</b>本物の教員ログイン機能はありません。このページはURLを知っている人が開けます。実在する生徒情報は入力せず、学校で運用する前にサーバー側認証・アクセス制御を実装してください。</div>
<section class="hero"><h1>教員用 意見管理</h1><div>投稿内容の確認、対応状況、回答、公開設定を管理する試作画面です。</div></section>
<div class="stats"><div class="stat"><b id="total">0</b><span>投稿総数</span></div><div class="stat"><b id="new">0</b><span>教員確認待ち</span></div><div class="stat"><b id="pending">0</b><span>検討中</span></div><div class="stat"><b id="replied">0</b><span>回答記入済み</span></div></div>
<h2>受け付けた意見</h2><div id="items"></div><p class="hint">※生徒用ページと同じ端末・同じブラウザ内の試作データだけを表示します。別端末との共有はできません。</p>
</main><script>
const KEY="yv_entries_demo";const $=id=>document.getElementById(id);let data=JSON.parse(localStorage.getItem(KEY)||"[]");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
$("total").textContent=data.length;$("new").textContent=data.filter(x=>!x.reviewed).length;$("pending").textContent=data.filter(x=>x.status==="pending").length;$("replied").textContent=data.filter(x=>x.reply&&x.reply.trim()).length;
if(!data.length){$("items").innerHTML='<div class="empty">まだ投稿はありません。生徒用ページから試しに投稿すると、ここに表示されます。</div>';return}
$("items").innerHTML=[...data].reverse().map((x,i)=>`<article class="item"><div class="top"><div><div class="meta">受付番号：${esc(x.id)} ／ 投稿日：${esc(x.date)}</div><h3>${esc(x.title)}</h3><div class="meta">分野：${esc(x.category)} ／ 公開希望：${x.public?"あり":"なし"}</div></div><div class="meta">${x.reviewed?"教員確認済み":"教員確認待ち"}</div></div><div class="body">${esc(x.body)}</div><div class="meta">任意情報：学年 ${esc(x.grade||"未入力")}・クラス ${esc(x.className||"未入力")}・番号 ${esc(x.number||"未入力")}・氏名 ${esc(x.name||"未入力")}</div><div class="grid"><div><label>対応状況</label><select id="s${i}"><option value="pending" ${x.status==="pending"?"selected":""}>検討中</option><option value="done" ${x.status==="done"?"selected":""}>実行</option><option value="no" ${x.status==="no"?"selected":""}>実行不可</option></select></div><div><label>次回確認予定日</label><input id="d${i}" type="date" value="${esc(x.nextDate||"")}"></div><div style="grid-column:1/-1"><label>生徒への回答・理由</label><textarea id="r${i}" placeholder="対応結果や理由、次回確認予定など">${esc(x.reply||"")}</textarea></div><div style="grid-column:1/-1"><label class="check"><input id="v${i}" type="checkbox" ${x.reviewed?"checked":""}> 担当教員による確認が完了した</label><label class="check"><input id="p${i}" type="checkbox" ${x.published?"checked":""} ${x.public?"":"disabled"}> 個人情報を確認し、公開一覧に掲載する</label><p class="hint">${x.public?"投稿者は公開を許可しています。公開前に個人情報を確認してください。":"投稿者が公開を許可していないため、公開できません。"}</p></div></div><button class="btn" data-save="${i}">この内容を保存</button></article>`).join("");
document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{let i=+b.dataset.save,x=data[data.length-1-i];x.status=$("s"+i).value;x.nextDate=$("d"+i).value;x.reply=$("r"+i).value;x.reviewed=$("v"+i).checked;x.published=$("p"+i).checked&&x.public;localStorage.setItem(KEY,JSON.stringify(data));alert("このブラウザ内の試作データを更新しました。");render()});
}render();
</script></body></html>
